name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
  opencode-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        opencode: ['1.1.48', '1.19.5']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global opencode-ai@${{ matrix.opencode }}
      - run: npm run test:integration
      - name: Verify real Windows scheduled execution
        if: runner.os == 'Windows' && matrix.opencode == '1.19.5'
        shell: pwsh
        run: ./test/windows-schedule.ps1
